# Single source of truth for publications.
# Used by: the website (publications page, featured papers on the home page),
# tools/cv.py (LaTeX lists for the long CV, venue counts for the short CV, CCV BibTeX).
#
# Fields:
#   id         unique slug (firstauthor + year + title words), assigned once and never changed,
#              even if the title changes: the CV and CCV (BibTeX keys) refer to it.
#              Match papers by arxiv id first, title second.
#   authors    as they should appear; "I. Mitliagkas" is bolded automatically; "*" marks equal contribution
#   status     accepted | workshop | preprint
#   venue      key into _data/venues.yml (accepted papers only)
#   venue_text free-text venue (workshops, preprints, or venues without a key)
#   highlight  oral | spotlight (optional)
#   note       extra text after the venue, e.g. an award (optional)
#   arxiv      arXiv id (optional; unique: two entries never share one);  url: other link (optional);  code: code link (optional)
#   topics     any of: optimization, generalization, unlearning, games, other
#   featured   true -> shown on the home page under its first topic
#   ccv        true once imported into the Canadian Common CV
