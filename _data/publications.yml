- id: hemmat2024-lead-least-action
  title: 'LEAD: Least-Action Dynamics for Min-Max Optimization'
  authors:
  - R. Askari Hemmat*
  - A. Mitra*
  - G. Lajoie
  - I. Mitliagkas
  year: 2024
  status: accepted
  venue: iclr
  arxiv: '2010.13846'
  url: https://openreview.net/forum?id=vXSsTYs6ZB
  note: (invited); Transactions on Machine Learning Research (TMLR) [featured]
  topics:
  - games
  - optimization
  summary: >-
    Min-max training, as in GANs, stalls because of rotational dynamics. Treating
    the two players as particles under physical forces, we derive LEAD, a
    second-order method that damps the rotation. It converges linearly on
    quadratic games and improves GAN training on CIFAR-10.
  figure: /images/papers/hemmat2024-lead-least-action.png
  figure_alt: >-
    Eigenvalues in the complex plane: LEAD's (red) lie inside the unit circle,
    gradient descent-ascent's (blue) lie outside it.
  featured: true
