- part: Crash course in optimization
  note: For the first half of the class we will be closely following the previous iteration of the class.
  sessions:
  - dates:
    - Jan 18
    - Jan 19
    topic: Basics of convex analysis and gradient descent
    materials:
    - label: scribed notes
      url: /ift6169-2023/ift-6169-lecture-2-notes.pdf
    reading: |
      Convex analysis basics from 'Convex Optimization' by Boyd, Vandenberge ([[5](#ref-5)] under references):
      - Chapter 2 (required: beginning of chapter to 2.1.4, recommended: 2.1.5 to end of section)
      - Chapter 3 (required: beginning of chapter to 3.1, recommended: 3.2, 3.3 and 3.4)

      Convergence proofs: from Chapter 3 of [[1](#ref-1)] ('Convex Optimization...' by S.Bubeck under References)
      - Required: Convergence proof of Theorem 3.2 (note that we studied the unconstrained case. In this case the projection operator PiX(x) is the identity operator)
  - dates:
    - Jan 25
    topic: 'The different rates of gradient descent: from Lipschitz to strongly convex'
    materials:
    - label: scribed notes
      url: /ift6169-2023/ift-6169-lecture-3-notes.pdf
    reading: |
      Convergence proofs from Chapter 3 of [[1](#ref-1)] ('Convex Optimization...' by S.Bubeck under References)
      - Required: Sections 3.1, 3.2, 3.4, with emphasis on the Convergence proof of Theorem 3.12
      - Optional: Section 3.3 and anything related to constrained optimization. Keep in mind that we still discuss in class simplified unconstrained versions of some constrained results from Bubeck. Anything in our scribed notes is also required.
  - dates:
    - Jan 26
    topic: Black box models and lower bounds
    materials:
    - label: scribed notes
      url: /ift6169-2023/ift-6169-lecture-4-notes.pdf
    reading: |
      - Required: [[1](#ref-1), Theorem 3.15]
      - Recommended: [[6](#ref-6)]
  - dates:
    - Feb 1
    topic: 'Accelerated methods: Polyak''s momentum (the heavy ball method)'
    materials:
    - label: scribed notes
      url: /ift6169-2023/ift-6169-lecture-5-notes.pdf
    - label: slides
      url: /ift6169-2023/ift-6169-lecture-5-slides.pdf
    reading: |
      - Required: [[8](#ref-8)], [[9](#ref-9), Sections 1, 2, 3, 4]
      - Recommended: [[35](#ref-35)]
  - dates:
    - Feb 2
    topic: Nesterov's Accelerated Gradient, Stochastic gradient descent
