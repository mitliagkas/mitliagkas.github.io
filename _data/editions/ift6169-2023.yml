      url: /ift6169-2023/ift-6169-lecture-6-notes.pdf
    reading: |
      - Required: [[6](#ref-6)], [[7](#ref-7), pages 67-76]
      - Required: [[1](#ref-1), Section 6 until 6.2], [[4](#ref-4), Section 14.3]
