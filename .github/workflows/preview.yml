# Builds non-master branches with the same gem set GitHub Pages uses,
# and publishes the result to the `preview-site` branch for review.
name: Preview build
on:
  push:
    branches-ignore: [master, preview-site]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build
        run: bundle exec jekyll build --trace 2>&1 | tee build.log
      - name: Check build warnings
        run: |
          grep -iE "warn|error|deprecat" build.log || echo "no warnings"
      - name: Publish preview
        run: |
          cd _site
          git init -q -b preview-site
          git config user.name "preview-bot"
          git config user.email "preview-bot@users.noreply.github.com"
          cp ../build.log BUILD_LOG.txt
          echo "${GITHUB_REF_NAME} ${GITHUB_SHA}" > PREVIEW_SOURCE.txt
          git add -A && git commit -q -m "Preview of ${GITHUB_REF_NAME} @ ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-site
